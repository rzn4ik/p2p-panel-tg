<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Панель заявок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d0d15;--bg-card:#1a1a2a;--bg-inner:#0d0d15;--text:#fff;--text-dim:#888;--border:#2a2a3a;--accent:#a855f7;--accent-2:#10b981;--danger:#ef4444;--warning:#f59e0b;--heart:#ff4d6d;--info:#0ea5e9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);padding:15px;min-height:100vh;}
h1{font-size:16px;margin-bottom:5px;color:var(--accent);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.badge{font-size:10px;padding:3px 8px;border-radius:8px;background:var(--border);color:var(--text-dim);font-weight:500}
.badge.admin, .badge.worker{background:var(--accent);color:#fff}
.badge.client{background:var(--heart);color:#fff}
.me{font-size:11px;color:var(--text-dim);margin-bottom:15px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;}
.tabs button{flex:1;padding:9px;border:none;border-radius:6px;background:var(--bg-card);color:var(--text-dim);font-weight:bold;cursor:pointer;font-size:12px;white-space:nowrap;}
.tabs button.active{background:var(--accent);color:#fff;}
.card{background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--text-dim);border-radius:8px;padding:12px;margin-bottom:8px;}
.card.available{border-left-color:var(--accent)}
.card.active{border-left-color:var(--accent-2)}
.card.done{border-left-color:var(--text-dim);opacity:.7}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:bold;font-size:15px;}
.card-row{font-size:12px;margin-bottom:4px}
.card-row b{color:var(--accent)}
.card-actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.card-actions button{padding:8px 12px;border:none;border-radius:5px;background:var(--accent);color:#fff;font-size:12px;cursor:pointer;font-weight:600}
.card-actions button.green{background:var(--accent-2)}
.loading{text-align:center;padding:25px;color:var(--text-dim)}
.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:var(--accent-2);color:#fff;padding:10px 18px;border-radius:8px;font-weight:bold;z-index:9999;font-size:13px;}
#jsError{display:none; background:#ef4444; color:#fff; padding:10px; margin-bottom:10px; border-radius:8px; font-size:12px; word-wrap:break-word;}
.client-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--border); }
.client-info { font-size: 13px; }
.client-info span { font-size: 11px; color: var(--text-dim); }
.client-markup { display: flex; align-items: center; gap: 5px; }
.client-markup input { width: 60px; padding: 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-card); color: #fff; text-align: center;}
.client-markup button { padding: 6px 10px; border-radius: 4px; background: var(--accent-2); color: #fff; border: none; cursor: pointer; font-weight: bold;}
.create-btn{width:100%;padding:10px;background:var(--accent-2);color:#fff;border:none;border-radius:8px;font-weight:bold;margin-bottom:15px;cursor:pointer;display:none;font-size:14px;}
.form-box{background:var(--bg-card);padding:15px;border-radius:10px;margin-bottom:15px;border:1px solid var(--border);display:none;}
.form-box input{width:100%;padding:10px;margin-bottom:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:#fff;font-size:14px;}
.form-box button{width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}
.timer { font-size: 12px; color: var(--warning); font-weight: bold; }
.timer.expired { color: var(--danger); }
</style>
</head>
<body>

<div id="jsError"></div>

<h1>📊 Панель заявок <span id="userBadge" class="badge">...</span></h1>
<div class="me" id="userInfo">Инициализация...</div>

<button id="createBtn" class="create-btn" onclick="toggleForm()">+ Создать заявку</button>

<div id="createForm" class="form-box">
    <input type="number" id="amount" placeholder="Сумма (₽)" required>
    <input type="number" id="rate" placeholder="Курс (автоматически)" readonly style="opacity:0.7; background: #0d0d15;">
    <input type="number" id="checks" placeholder="Количество чеков (шт)" required>
    <input type="number" id="timer" placeholder="Таймер (минут)" required>
    <input type="text" id="bank" placeholder="Банк (например, Сбер)" required>
    <input type="text" id="card" placeholder="Номер карты" required>
    <input type="text" id="phone" placeholder="Телефон" required>
    <button onclick="submitPayout()">Опубликовать</button>
</div>

<div class="tabs" id="tabsContainer">
  <button id="tabPayouts" class="active" onclick="setTab('payouts')">📋 Заявки</button>
  <button id="tabClients" onclick="setTab('clients')" style="display:none;">👥 Клиенты</button>
</div>

<div id="content" class="loading">Загрузка данных...</div>

<script>
window.onerror = function(msg, url, line) {
  const el = document.getElementById('jsError');
  el.style.display = 'block';
  el.innerText = 'ОШИБКА: ' + msg + ' (строка ' + line + ')';
  return false;
};

const API_URL = 'https://fragrant-art-d8ae.rzn4ik.workers.dev';
let tg = null;
let currentUser = null;
let currentTab = 'payouts';
let clientsList = [];
let payoutsList = [];
let timerInterval = null;

document.addEventListener('DOMContentLoaded', () => {
    if (window.Telegram && window.Telegram.WebApp) {
        tg = window.Telegram.WebApp;
        try { tg.expand(); tg.ready(); } catch(e) { console.log('TG Error:', e); }
    } else {
        showError('Открыто вне Telegram.');
        return;
    }
    initApp();
});

async function initApp() {
    try {
        let initData = tg ? tg.initData : '';
        if (!initData) { showError('Нет данных от Telegram.'); return; }

        document.getElementById('userInfo').innerText = 'Авторизация...';
        const res = await fetch(`${API_URL}/api/auth`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData: initData })
        });
        
        if (!res.ok) throw new Error('Сервер вернул ошибку ' + res.status);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        currentUser = data.user;
        updateUI();
        await fetchData();

    } catch (e) {
        showError('Авторизация: ' + e.message);
        document.getElementById('content').innerHTML = '<div class="loading" style="color:red">Ошибка авторизации</div>';
    }
}

function updateUI() {
    if (!currentUser) return;
    const badge = document.getElementById('userBadge');
    const info = document.getElementById('userInfo');
    badge.textContent = `@${currentUser.username} (${currentUser.role})`;
    badge.className = 'badge ' + currentUser.role;
    
    const isStaff = currentUser.role === 'admin' || currentUser.role === 'worker';

    if (isStaff) {
        info.textContent = `ID: ${currentUser.telegram_id} • Наценка: ${currentUser.markup || 0}%`;
        document.getElementById('tabClients').style.display = 'block';
        document.getElementById('createBtn').style.display = 'block';
    } else {
        info.textContent = `ID: ${currentUser.telegram_id}`;
    }
}

function toggleForm() {
    const form = document.getElementById('createForm');
    form.style.display = form.style.display === 'block' ? 'none' : 'block';
    if (form.style.display === 'block') {
        // Заглушка для курса Рапиры, позже заменим на реальный парсинг
        document.getElementById('rate').value = 90.5; 
    }
}

async function submitPayout() {
    const amount = document.getElementById('amount').value;
    const rate = document.getElementById('rate').value;
    const checks = document.getElementById('checks').value;
    const timer_min = document.getElementById('timer').value;
    const bank = document.getElementById('bank').value;
    const card = document.getElementById('card').value;
    const phone = document.getElementById('phone').value;

    if (!amount || !rate || !bank || !card || !phone || !checks || !timer_min) { 
        showToast('Заполните все поля!'); 
        return; 
    }

    try {
        const res = await fetch(`${API_URL}/api/payouts`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount, rate, bank, card, phone, checks, timer_min })
        });
        if (!res.ok) throw new Error('Ошибка сервера');
        
        showToast('Заявка создана!');
        toggleForm();
        await fetchData();
    } catch(e) {
        showError('Создание: ' + e.message);
    }
}

function setTab(tab) {
    currentTab = tab;
    document.getElementById('tabPayouts').classList.remove('active');
    document.getElementById('tabClients').classList.remove('active');
    document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
    
    if (tab === 'clients') fetchClients();
    else fetchData();
}

async function fetchData() {
    try {
        const res = await fetch(`${API_URL}/api/payouts`);
        const data = await res.json();
        payoutsList = data;
        renderPayouts();
    } catch (e) { showError('Загрузка заявок: ' + e.message); }
}

async function fetchClients() {
    try {
        const res = await fetch(`${API_URL}/api/clients`);
        clientsList = await res.json();
        renderClients();
    } catch (e) { showError('Загрузка клиентов: ' + e.message); }
}

function renderClients() {
    const container = document.getElementById('content');
    if (clientsList.length === 0) { container.innerHTML = '<div class="loading">Клиентов пока нет</div>'; return; }

    container.innerHTML = clientsList.map(c => `
        <div class="client-row">
            <div class="client-info">
                <b>@${c.username}</b><br>
                <span>ID: ${c.telegram_id} | ${c.role === 'client' ? 'Клиент' : c.role}</span>
            </div>
            <div class="client-markup">
                <input type="number" id="markup_${c.telegram_id}" value="${c.markup || 0}" step="0.1">
                <span>%</span>
                <button onclick="saveMarkup('${c.telegram_id}')">OK</button>
            </div>
        </div>
    `).join('');
}

async function saveMarkup(tgId) {
    const val = document.getElementById(`markup_${tgId}`).value;
    try {
        await fetch(`${API_URL}/api/clients/markup`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ telegram_id: tgId, markup: val })
        });
        showToast('Наценка сохранена');
    } catch (e) { showError('Сохранение: ' + e.message); }
}

function updateTimers() {
    const now = new Date().getTime();
    document.querySelectorAll('.timer').forEach(el => {
        const created = new Date(el.dataset.created).getTime();
        const duration = parseInt(el.dataset.duration) * 60000;
        const end = created + duration;
        const diff = end - now;

        if (diff > 0) {
            const mins = Math.floor(diff / 60000);
            const secs = Math.floor((diff % 60000) / 1000);
            el.innerText = `⏳ ${mins}:${secs.toString().padStart(2, '0')}`;
            el.classList.remove('expired');
        } else {
            el.innerText = '❌ Истекло';
            el.classList.add('expired');
        }
    });
}

function renderPayouts() {
    const container = document.getElementById('content');
    if (payoutsList.length === 0) { container.innerHTML = '<div class="loading">Нет заявок</div>'; return; }

    // Рассчитываем курс с наценкой для текущего пользователя
    let markup = currentUser.markup || 0;

    container.innerHTML = payoutsList.map(p => {
        const finalRate = (parseFloat(p.rate) + (parseFloat(p.rate) * markup / 100)).toFixed(2);
        return `
        <div class="card ${p.status}">
            <div class="card-header">
                <span>${Math.round(p.amount)} ₽</span>
                <span style="font-size:12px; color:var(--warning)">Курс: ${finalRate}</span>
            </div>
            <div class="card-row">💳 Карта: <b>${p.card_number || '—'}</b></div>
            <div class="card-row">📱 Телефон: <b>${p.phone || '—'}</b></div>
            <div class="card-row">🏦 Банк: <b>${p.bank}</b></div>
            <div class="card-row">📄 Чеков: <b>${p.checks || 1}</b></div>
            <div class="card-row timer" data-created="${p.created_at}Z" data-duration="${p.timer_min || 60}">⏳ Загрузка...</div>
            <div class="card-actions">
                ${p.status === 'available' ? `<button class="green" onclick="takePayout(${p.id})">❤️ Взять в работу</button>` : ''}
            </div>
        </div>
    `}).join('');
    
    updateTimers();
}

async function takePayout(id) {
    showToast('Взято в работу (тест)');
}

function showError(msg) {
    const el = document.getElementById('jsError');
    el.style.display = 'block';
    el.innerText = 'Ошибка: ' + msg;
}

function showToast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerText = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
}
</script>
</body>
</html>
